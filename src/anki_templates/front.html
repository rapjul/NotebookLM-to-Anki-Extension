<div class="main-wrapper mode-centered">
	<div class="quiz-column">
		<div class="quiz-content-wrapper">
			<div class="question-text" id="q-text"></div>

			<!-- Inline Question Image / Diagram -->
			{{#Image}}
			<div class="question-media" id="q-media">{{Image}}</div>
			{{/Image}}

			<!-- Dynamic Question Interface Container -->
			<div id="front-interactive-area">
				<div class="options-list" id="front-options">
					<div class="template-loading">Loading...</div>
				</div>
			</div>

			<div class="hint-container">
				<div
					class="hint-btn"
					id="hint-toggle"
					onclick="event.stopPropagation()"
				>
					<!-- Material Design 'lightbulb' icon: https://fonts.google.com/icons?selected=Material+Symbols+Outlined:lightbulb -->
					<svg
						class="status-icon hint-icon"
						viewBox="0 0 24 24"
						width="18"
						height="18"
						fill="currentColor"
						xmlns="http://www.w3.org/2000/svg"
						aria-hidden="true"
					>
						<path
							d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-1.3l-.85-.6A5.004 5.004 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"
						/>
					</svg>
					Hint
				</div>
				<div class="hint-text-box" id="hint-content"></div>
			</div>
		</div>
	</div>
</div>

<div id="raw-data" class="is-hidden">
	<div id="d-question">{{Question}}</div>
	<div id="d-hint">{{Hint}}</div>
	{{#Image}}
	<div id="d-image">{{Image}}</div>
	{{/Image}}
	<div id="d-qtype">{{QuestionType}}</div>
	<div id="d-target">{{TargetAnswer}}</div>
	<div id="d-acceptable">{{AcceptableAnswers}}</div>
	<div id="d-rubric">{{Rubric}}</div>
	<div id="d-general-rationale">{{GeneralRationale}}</div>

	<div
		data-opt="A"
		data-text="{{Option1}}"
		data-flag="{{Flag1}}"
		data-reason="{{Rationale1}}"
	></div>
	<div
		data-opt="B"
		data-text="{{Option2}}"
		data-flag="{{Flag2}}"
		data-reason="{{Rationale2}}"
	></div>
	<div
		data-opt="C"
		data-text="{{Option3}}"
		data-flag="{{Flag3}}"
		data-reason="{{Rationale3}}"
	></div>
	<div
		data-opt="D"
		data-text="{{Option4}}"
		data-flag="{{Flag4}}"
		data-reason="{{Rationale4}}"
	></div>
</div>

<script>
	(function () {
		// Clean lifecycle reset for AnkiMobile's persistent WKWebView across cards
		window.__notebooklmAllowHostFlip = false;

		// Prevent AnkiMobile from auto-advancing when tapping anywhere on the card,
		// EXCEPT when interacting with inputs, buttons, options, or hint.
		/**
		 * Intercepts tap/click events to prevent premature flipping on mobile platforms.
		 *
		 * Allows interaction only for recognized interactive controls.
		 *
		 * @param {Event} e - The click or touchend event.
		 * @returns {void}
		 */
		const interceptTap = (e) => {
			if (window.__notebooklmAllowHostFlip) return;

			// Interactive controls that should handle their own interactions
			const isInteractive =
				e.target &&
				(e.target.closest(".fitb-input") ||
					e.target.closest(".fitb-submit-btn") ||
					e.target.closest(".fitb-form") ||
					e.target.closest(".ms-option-btn") ||
					e.target.closest(".ms-submit-btn") ||
					e.target.closest(".mc-option-btn") ||
					e.target.closest(".option-block") ||
					e.target.closest(".submit-btn") ||
					e.target.closest(".sa-scratchpad") ||
					e.target.closest(".sa-submit-btn") ||
					e.target.closest(".tappable") ||
					e.target.closest("#hint-toggle") ||
					e.target.closest(".diagram-alt-description") ||
					e.target.closest(".question-media img"));

			if (isInteractive) {
				return;
			}

			// Taps on non-interactive whitespace / background should not accidentally flip
			e.stopPropagation();
			if (e.cancelable) e.preventDefault();
		};
		window.addEventListener("click", interceptTap, true);
		window.addEventListener("touchend", interceptTap, true);

		// --- 1. THE TRANSLATOR (Fixes $$ -> \[) ---
		/**
		 * Converts LaTeX math notation ($$ ... $$ and $ ... $) and backtick code snippets
		 * into Anki MathJax delimiters and HTML code tags.
		 *
		 * @param {string} str - Raw input string with math or code markdown.
		 * @returns {string} Sanitized string with MathJax brackets and code tags.
		 */
		function cleanMath(str) {
			if (!str) return "";
			// Convert Block Math: $$ ... $$ -> \[ ... \]
			let s = str.replace(/\$\$(.*?)\$\$/gs, "\\[$1\\]");
			// Convert Inline Math: $ ... $ -> \( ... \)
			s = s.replace(/\$((?:[^$]|\\$)+?)\$/g, "\\($1\\)");
			// Convert Code: `...` -> <code>...</code>
			s = s.replace(
				/`([^`]+)`/g,
				'<code class="latex-snippet">$1</code>',
			);

			// Prevent line breaks before/after narrow inline math (e.g. orphan closing parentheses)
			s = s.replace(
				/\(\s*(\\\([^\n]+?\\\))\s*\)/g,
				'<span class="math-nowrap">($1)</span>',
			);
			s = s.replace(
				/(\\\([^\n]{1,30}?\\\))([)\],.;:!?])/g,
				'<span class="math-nowrap">$1$2</span>',
			);
			s = s.replace(
				/([(\[{])(\\\([^\n]{1,30}?\\\))/g,
				'<span class="math-nowrap">$1$2</span>',
			);
			return s;
		}

		// --- 2. MATH RENDERER ---
		/**
		 * Triggers MathJax typesetting on the specified DOM element.
		 *
		 * Supports both MathJax v3 (typesetPromise) and MathJax v2 (Hub.Queue).
		 *
		 * @param {HTMLElement} element - Target container element to typeset.
		 * @returns {void}
		 */
		function triggerMath(element) {
			if (typeof MathJax !== "undefined" && MathJax.typesetPromise) {
				MathJax.typesetPromise([element]).catch((err) => {});
			} else if (typeof MathJax !== "undefined" && MathJax.Hub) {
				MathJax.Hub.Queue(["Typeset", MathJax.Hub, element]);
			}
		}

		/**
		 * Normalizes a fill-in-the-blank user response or accepted answer string
		 * by trimming, lowercasing, and stripping surrounding math dollar delimiters.
		 *
		 * @param {string|null|undefined} str - Raw answer string.
		 * @returns {string} Normalized lowercase string.
		 */
		function normalizeBlank(str) {
			if (!str) return "";
			return String(str)
				.trim()
				.toLowerCase()
				.replace(/^\$+|\$+$/g, "")
				.trim();
		}

		/**
		 * Stops touch/mouse events on an interactive element from bubbling up to the
		 * host app's (e.g. AnkiMobile) tap-to-show-answer handler, which would otherwise
		 * flip the card on the first tap.
		 *
		 * Click events are left alone so the element's own handlers still run.
		 *
		 * @param {HTMLElement} el - Interactive element to shield.
		 * @returns {void}
		 */
		function shieldHostTap(el) {
			["touchstart", "touchend", "mousedown", "mouseup", "pointerup"].forEach(
				(type) => el.addEventListener(type, (e) => e.stopPropagation()),
			);
		}

		// Flip card to back helper
		/**
		 * Dispatches answer revelation command to flip the card to the back side
		 * across Desktop, AnkiMobile, and AnkiDroid platforms.
		 *
		 * @returns {void}
		 */
		function flipToBack() {
			window.__notebooklmAllowHostFlip = true;
			// 1. Anki Desktop
			if (typeof pycmd !== "undefined") {
				pycmd("ans");
				return;
			}
			// 2. AnkiDroid
			if (typeof showAnswer !== "undefined") {
				showAnswer();
				return;
			}
			if (
				typeof AnkiDroidJS !== "undefined" &&
				typeof AnkiDroidJS.showAnswer !== "undefined"
			) {
				AnkiDroidJS.showAnswer();
				return;
			}
			// 3. AnkiWeb
			if (
				typeof study !== "undefined" &&
				typeof study.drawAnswer !== "undefined"
			) {
				study.drawAnswer();
				return;
			}
			// 4. AnkiMobile (iOS WebKit message handler bridge)
			if (
				window.webkit &&
				window.webkit.messageHandlers &&
				window.webkit.messageHandlers.cb
			) {
				try {
					window.webkit.messageHandlers.cb.postMessage(
						JSON.stringify({ scheme: "ankitap", msg: "midCenter" }),
					);
				} catch (err) {}
			}
			if (window.anki && typeof window.sendMessage2 === "function") {
				try {
					window.sendMessage2("ankitap", "midCenter");
				} catch (err) {}
			}

			// 5. Simulated keyboard event fallback
			try {
				const ev = document.createEvent("Event");
				ev.initEvent("keypress", true, true);
				ev.which = ev.keyCode = 13;
				document.dispatchEvent(ev);
			} catch (err) {}
		}

		try {
			// --- 3. PROCESS QUESTION, MEDIA & HINT ---
			const qRaw = document.getElementById("d-question").innerHTML;
			const hRaw = document.getElementById("d-hint").innerHTML;
			const dImage = document.getElementById("d-image");
			const imgRaw = dImage ? dImage.innerHTML.trim() : "";

			document.getElementById("q-text").innerHTML = cleanMath(qRaw);

			// Render inline image if present
			const mediaBox = document.getElementById("q-media");
			if (mediaBox) {
				const hasImage = Boolean(imgRaw && imgRaw.length > 0);
				mediaBox.classList.toggle("is-visible", hasImage);
				if (hasImage) {
					mediaBox.innerHTML = imgRaw;

					const imgEl = mediaBox.querySelector("img");
					if (imgEl && imgEl.alt && imgEl.alt.trim()) {
						const descBox = document.createElement("div");
						descBox.className = "diagram-alt-description";

						const labelSpan = document.createElement("span");
						labelSpan.className = "diagram-alt-label";
						labelSpan.textContent = "Description: ";
						descBox.appendChild(labelSpan);

						const textSpan = document.createElement("span");
						textSpan.textContent = imgEl.alt.trim();
						descBox.appendChild(textSpan);

						mediaBox.appendChild(descBox);

						imgEl.setAttribute("tabindex", "0");
						imgEl.setAttribute("role", "button");
						imgEl.setAttribute("aria-expanded", "false");

						/**
						 * Toggles visibility of the diagram alt text description box.
						 *
						 * @param {Event} evt - Click or keydown event.
						 * @returns {void}
						 */
						const toggleDesc = (evt) => {
							evt.stopPropagation();
							const isShown = descBox.classList.contains("is-open");
							descBox.classList.toggle("is-open", !isShown);
							imgEl.setAttribute(
								"aria-expanded",
								String(!isShown),
							);
						};

						imgEl.addEventListener("click", toggleDesc);
						imgEl.addEventListener("keydown", (evt) => {
							if (evt.key === "Enter" || evt.key === " ") {
								evt.preventDefault();
								toggleDesc(evt);
							}
						});
					}
				}
			}

			// Render hint
			const hBox = document.getElementById("hint-content");
			if (hRaw.trim()) {
				hBox.innerHTML = cleanMath(hRaw);
			} else {
				const hBtn = document.getElementById("hint-toggle");
				if (hBtn) hBtn.classList.add("is-hidden");
			}

			const qRawForId = document.getElementById("d-question").innerHTML;
			const cardId = qRawForId
				.substring(0, 50)
				.replace(/[^a-zA-Z0-9]/g, "");

			// Determine Question Type
			const rawType = (
				document.getElementById("d-qtype")?.textContent || ""
			)
				.trim()
				.toUpperCase();
			const dataItems = document.querySelectorAll(
				"#raw-data > div[data-opt]",
			);
			const validItems = Array.from(dataItems).filter((item) => {
				const rawText = item.dataset.text || "";
				const rawReason = item.dataset.reason || "";
				return rawText.trim() || rawReason.trim();
			});

			let questionType = rawType;
			if (!questionType) {
				const correctCount = validItems.filter((i) => {
					const f = (i.dataset.flag || "").trim().toLowerCase();
					return f === "true" || f === "yes" || f === "1";
				}).length;
				if (correctCount > 1) {
					questionType = "MULTIPLE_SELECT";
				} else if (validItems.length > 0) {
					questionType = "MULTIPLE_CHOICE";
				} else if (
					document.getElementById("d-target")?.textContent.trim()
				) {
					questionType = "FILL_IN_THE_BLANK";
				} else {
					questionType = "SHORT_ANSWER";
				}
			}

			// Add question type scope class to the main wrapper
			const wrapper = document.querySelector(".main-wrapper");
			if (wrapper) {
				wrapper.classList.add(
					"qtype-" + questionType.toLowerCase().replace(/_/g, "-"),
				);
			}

			const interactiveArea = document.getElementById(
				"front-interactive-area",
			);

			// --- 4. RENDER ADAPTIVE INTERACTION BY QUESTION TYPE ---
			if (questionType === "MULTIPLE_SELECT") {
				// MULTIPLE SELECT: Checkboxes with "Check Answer" submit button
				interactiveArea.innerHTML = `
					<div class="options-list ms-options-list" id="front-options"></div>
					<div class="ms-submit-btn submit-btn btn-disabled" id="ms-submit-btn" role="button" tabindex="0">Select at least 1 option</div>
					<div id="ms-warning" class="ms-warning-text is-hidden">Please select at least one option before checking.</div>
				`;
				const container = document.getElementById("front-options");
				const submitBtn = document.getElementById("ms-submit-btn");
				const warningEl = document.getElementById("ms-warning");

				// Shuffle options
				for (let i = validItems.length - 1; i > 0; i--) {
					const j = Math.floor(Math.random() * (i + 1));
					[validItems[i], validItems[j]] = [
						validItems[j],
						validItems[i],
					];
				}

				try {
					sessionStorage.setItem(
						"notebooklm_shuffle_" + cardId,
						JSON.stringify(validItems.map((i) => i.dataset.opt)),
					);
				} catch (e) {}

				const selectedOpts = new Set();

				/**
				 * Updates the submit button label and enabled/disabled state based on selection count.
				 *
				 * @returns {void}
				 */
				const updateSubmitState = () => {
					if (selectedOpts.size > 0) {
						submitBtn.classList.remove("btn-disabled");
						submitBtn.textContent = "Check Answer";
						if (warningEl) {
							warningEl.classList.add("is-hidden");
						}
					} else {
						submitBtn.classList.add("btn-disabled");
						submitBtn.textContent = "Select at least 1 option";
					}
				};

				validItems.forEach((item, index) => {
					const originalLetter = item.dataset.opt;
					const displayLetter = String.fromCharCode(65 + index);
					const text = cleanMath(item.dataset.text || "");

					const btn = document.createElement("button");
					btn.type = "button";
					btn.className = "ms-option-btn tappable";
					btn.setAttribute("onclick", "void(0)");
					btn.dataset.opt = originalLetter;

					btn.innerHTML = `
						<div class="option-content" style="pointer-events: none;">
							<span class="ms-checkbox"></span>
							<span class="option-letter">${displayLetter}.</span>
							<span>${text}</span>
						</div>
					`;

					/**
					 * Toggles selection state for this option and synchronizes state to sessionStorage.
					 *
					 * @returns {void}
					 */
					const toggleOption = () => {
						if (selectedOpts.has(originalLetter)) {
							selectedOpts.delete(originalLetter);
							btn.classList.remove("is-selected");
						} else {
							selectedOpts.add(originalLetter);
							btn.classList.add("is-selected");
						}
						try {
							sessionStorage.setItem(
								"notebooklm_ms_sel_" + cardId,
								JSON.stringify(Array.from(selectedOpts)),
							);
						} catch (err) {}
						updateSubmitState();
					};

					let lastTouchTime = 0;

					/**
					 * Handles tap/touch events on this option, preventing host review flip
					 * and suppressing ghost click events.
					 *
					 * @param {Event} e - Touch or click event.
					 * @returns {void}
					 */
					const handleOptionTap = (e) => {
						if (e.type === "touchstart") {
							lastTouchTime = Date.now();
							if (e.cancelable) e.preventDefault();
							e.stopPropagation();
							toggleOption();
							return;
						}
						if (e.type === "click") {
							// Suppress ghost click fired shortly after touchstart
							if (Date.now() - lastTouchTime < 400) {
								if (e.cancelable) e.preventDefault();
								e.stopPropagation();
								return;
							}
							toggleOption();
						}
					};

					btn.addEventListener("touchstart", handleOptionTap);
					btn.addEventListener("click", handleOptionTap);
					container.appendChild(btn);
				});

				/**
				 * Submits multi-select selections and flips the card.
				 *
				 * Enforces that at least one option must be selected before advancing.
				 *
				 * @param {Event} [e] - Optional trigger event.
				 * @returns {void}
				 */
				const submitMultiSelect = (e) => {
					if (selectedOpts.size === 0) {
						if (e && e.cancelable) e.preventDefault();
						if (e) e.stopPropagation();
						if (warningEl) {
							warningEl.classList.remove("is-hidden");
						}
						submitBtn.classList.add("btn-shake");
						setTimeout(() => {
							submitBtn.classList.remove("btn-shake");
						}, 500);
						return;
					}

					try {
						sessionStorage.setItem(
							"notebooklm_ms_sel_" + cardId,
							JSON.stringify(Array.from(selectedOpts)),
						);
					} catch (err) {}

					window.__notebooklmAllowHostFlip = true;
					submitBtn.textContent = "✓ Checked — Tap to Reveal";
					flipToBack();
				};

				submitBtn.addEventListener("touchstart", submitMultiSelect, { passive: true });
				submitBtn.addEventListener("mousedown", submitMultiSelect, { passive: true });
				submitBtn.addEventListener("click", submitMultiSelect);
				submitBtn.addEventListener("keydown", (e) => {
					if (e.key === "Enter" || e.keyCode === 13) {
						submitMultiSelect(e);
					}
				});
			} else if (questionType === "FILL_IN_THE_BLANK") {
				// FILL IN THE BLANK: Text input + Check Answer button
				// A real <form> with a hidden submit button lets the mobile keyboard's Done/Go/Enter key trigger
				// an implicit submit reliably across iOS and Android.
				interactiveArea.innerHTML = `
					<form class="fitb-form fitb-container" id="fitb-form" action="javascript:void(0)" autocomplete="off">
						<input type="text" class="fitb-input" id="fitb-input" placeholder="Type your answer..." autocomplete="off" autocapitalize="off" enterkeyhint="done" />
						<input type="submit" class="visually-hidden" tabindex="-1" />
						<div class="fitb-submit-btn submit-btn" id="fitb-submit-btn" role="button" tabindex="0">Check Answer</div>
					</form>
					<div id="fitb-feedback" class="fitb-feedback is-hidden"></div>
				`;

				const formEl = document.getElementById("fitb-form");
				const inputEl = document.getElementById("fitb-input");
				const submitBtn = document.getElementById("fitb-submit-btn");
				const feedbackBox = document.getElementById("fitb-feedback");
				const targetAnswer = (
					document.getElementById("d-target")?.textContent || ""
				).trim();
				const rawAcceptable = (
					document.getElementById("d-acceptable")?.textContent || ""
				).trim();
				const generalRationale = (
					document.getElementById("d-general-rationale")
						?.textContent || ""
				).trim();
				let fitbSubmitted = false;

				/**
				 * Saves the typed fill-in-the-blank response to sessionStorage, displays inline feedback,
				 * dismisses the software keyboard, and flips the card to the back side.
				 *
				 * @param {Event} [e] - Optional triggering submit, click or keyboard event.
				 * @returns {void}
				 */
				const doSubmit = (e) => {
					if (e && e.cancelable) e.preventDefault();
					if (fitbSubmitted) return;
					fitbSubmitted = true;

					const val = inputEl.value.trim();

					// 1. Persist to sessionStorage for the Back template
					try {
						sessionStorage.setItem(
							"notebooklm_typed_" + cardId,
							val,
						);
					} catch (err) {}

					// 2. Dismiss mobile virtual keyboard
					inputEl.blur();

					// 3. Normalize and evaluate
					const typedNorm = normalizeBlank(val);
					const targetNorm = normalizeBlank(targetAnswer);
					const acceptedList = rawAcceptable
						? rawAcceptable.split(",").map((s) => normalizeBlank(s))
						: [];
					const isSkipped = typedNorm.length === 0;
					const isCorrect =
						!isSkipped &&
						(typedNorm === targetNorm ||
							acceptedList.includes(typedNorm));

					// 4. Reveal inline feedback on screen immediately (guarantees mobile responsiveness)
					// Material Design 'check' icon: https://fonts.google.com/icons?selected=Material+Symbols+Outlined:check
					const iconCheck = `<svg class="status-icon status-icon-correct" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
					// Material Design 'close' icon: https://fonts.google.com/icons?selected=Material+Symbols+Outlined:close
					const iconClose = `<svg class="status-icon status-icon-wrong" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`;
					// Material Design 'fast_forward' icon: https://fonts.google.com/icons?selected=Material+Symbols+Outlined:fast_forward
					const iconSkip = `<svg class="status-icon status-icon-skipped" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>`;

					const cardClass = isCorrect
						? "card-correct"
						: isSkipped
							? "card-skipped"
							: "card-wrong";
					const headerIcon = isCorrect
						? iconCheck
						: isSkipped
							? iconSkip
							: iconClose;
					const headerText = isCorrect
						? "That's right!"
						: isSkipped
							? "Skipped"
							: "Not quite";

					feedbackBox.innerHTML = `
						<div class="feedback-card ${cardClass}">
							<div class="feedback-header">
								${headerIcon}
								<span>${headerText}</span>
							</div>
							<div class="answer-row">
								<span class="answer-label">Your answer:</span>
								<span class="answer-value">${val || "<i>(No response entered)</i>"}</span>
							</div>
							${
								!isCorrect && targetAnswer
									? `
							<div class="answer-row">
								<span class="answer-label">Accepted answer:</span>
								<span class="answer-value">${cleanMath(targetAnswer)}</span>
							</div>`
									: ""
							}
						</div>
						${
							generalRationale
								? `
						<div class="general-rationale-box">
							<div class="rationale-heading">Explanation</div>
							<div>${cleanMath(generalRationale)}</div>
						</div>`
								: ""
						}
					`;
					feedbackBox.classList.remove("is-hidden");
					triggerMath(feedbackBox);

					// 5. Update submit button label and style
					submitBtn.classList.remove("btn-correct", "btn-skipped", "btn-wrong");
					if (isCorrect) {
						submitBtn.textContent = "✓ Correct — Tap to Grade";
						submitBtn.classList.add("btn-correct");
					} else if (isSkipped) {
						submitBtn.textContent = "⤼ Skipped — Tap to Grade";
						submitBtn.classList.add("btn-skipped");
					} else {
						submitBtn.textContent = "✕ Incorrect — Tap to Grade";
						submitBtn.classList.add("btn-wrong");
					}

					// 6. Allow host taps through so a tap on the card flips to Back in AnkiMobile
					window.__notebooklmAllowHostFlip = true;

					// 7. Flip card to back helper (works on Desktop and AnkiDroid)
					flipToBack();
				};

				inputEl.addEventListener("input", () => {
					try {
						sessionStorage.setItem(
							"notebooklm_typed_" + cardId,
							inputEl.value.trim(),
						);
					} catch (err) {}
				});

				formEl.addEventListener("submit", doSubmit);
				inputEl.addEventListener("keydown", (e) => {
					if (e.key === "Enter" || e.keyCode === 13) {
						doSubmit(e);
					}
				});

				submitBtn.addEventListener("touchstart", doSubmit, { passive: true });
				submitBtn.addEventListener("mousedown", doSubmit, { passive: true });
				submitBtn.addEventListener("click", doSubmit);
				/**
				 * Scrolls the card to the top of the page when the mobile keyboard opens or closes.
				 *
				 * In iOS WKWebView, when the card is shorter than the layout viewport (min-height: 0),
				 * window.scrollY remains 0 while the native UIScrollView pans the visual viewport.
				 *
				 * WebKit ignores window.scrollTo(0, 0) as a no-op when scrollY is already 0 unless
				 * a non-zero scroll position is committed across a frame boundary first.
				 *
				 * @returns {void}
				 */
				const resetScroll = () => {
					if (window.scrollY > 0) {
						window.scrollTo(0, 0);
					} else if (document.body) {
						document.body.style.minHeight =
							window.innerHeight + 2 + "px";
						window.scrollTo(0, 1);
						if (typeof requestAnimationFrame === "function") {
							requestAnimationFrame(() => {
								window.scrollTo(0, 0);
								document.body.style.minHeight = "";
							});
						} else {
							window.scrollTo(0, 0);
							document.body.style.minHeight = "";
						}
					} else {
						window.scrollTo(0, 0);
					}
					if (document.documentElement) {
						document.documentElement.scrollTop = 0;
					}
					if (document.body) {
						document.body.scrollTop = 0;
					}
				};

				/**
				 * Re-applies the scroll reset across the iOS keyboard animation window
				 * so native focus/keyboard scroll adjustments are overridden on both open and close.
				 *
				 * @returns {void}
				 */
				const scheduleScrollReset = () => {
					[0, 100, 250, 400, 600, 900].forEach((ms) =>
						setTimeout(resetScroll, ms),
					);
				};
				inputEl.addEventListener("focus", scheduleScrollReset);
				inputEl.addEventListener("blur", scheduleScrollReset);
				window.addEventListener("resize", scheduleScrollReset);
				if (window.visualViewport) {
					window.visualViewport.addEventListener(
						"resize",
						scheduleScrollReset,
					);
				}
				// Auto-focus input on desktop without letting the browser scroll it into view
				setTimeout(() => inputEl.focus({ preventScroll: true }), 150);
			} else if (questionType === "SHORT_ANSWER") {
				// SHORT ANSWER: Optional scratchpad + Reveal button
				interactiveArea.innerHTML = `
					<div class="sa-container">
						<textarea class="sa-scratchpad" id="sa-scratchpad" placeholder="Draft your answer here (optional)..." rows="4"></textarea>
						<div class="sa-submit-btn submit-btn" id="sa-submit-btn" role="button" tabindex="0">Show Model Answer & Rubric</div>
					</div>
				`;

				const scratchEl = document.getElementById("sa-scratchpad");
				const submitBtn = document.getElementById("sa-submit-btn");

				scratchEl.addEventListener("input", () => {
					try {
						sessionStorage.setItem(
							"notebooklm_sa_scratch_" + cardId,
							scratchEl.value.trim(),
						);
					} catch (err) {}
				});

				/**
				 * Submits scratchpad content and flips the card to reveal model answer and rubric.
				 *
				 * @param {Event} [e] - Optional triggering click or touch event.
				 * @returns {void}
				 */
				const submitShortAnswer = (e) => {
					if (e && e.cancelable) e.preventDefault();
					const val = scratchEl.value.trim();
					try {
						sessionStorage.setItem(
							"notebooklm_sa_scratch_" + cardId,
							val,
						);
					} catch (err) {}
					scratchEl.blur();
					submitBtn.textContent = "✓ Revealed — Tap to View";
					flipToBack();
				};

				submitBtn.addEventListener("touchstart", submitShortAnswer, { passive: true });
				submitBtn.addEventListener("mousedown", submitShortAnswer, { passive: true });
				submitBtn.addEventListener("click", submitShortAnswer);
			} else {
				// --- 4. PROCESS OPTIONS ---
				// MULTIPLE CHOICE: Standard single-choice options
				interactiveArea.innerHTML = `<div class="options-list" id="front-options"></div>`;
				const container = document.getElementById("front-options");

				// Shuffle options randomly
				for (let i = validItems.length - 1; i > 0; i--) {
					const j = Math.floor(Math.random() * (i + 1));
					[validItems[i], validItems[j]] = [
						validItems[j],
						validItems[i],
					];
				}

				try {
					sessionStorage.setItem(
						"notebooklm_shuffle_" + cardId,
						JSON.stringify(validItems.map((i) => i.dataset.opt)),
					);
				} catch (e) {}

				validItems.forEach((item, index) => {
					const originalLetter = item.dataset.opt;
					const displayLetter = String.fromCharCode(65 + index);
					const rawText = item.dataset.text || "";

					// Apply Translator
					const text = cleanMath(rawText);
					const flagStr = (item.dataset.flag || "")
						.trim()
						.toLowerCase();
					const isCorrect =
						flagStr === "true" ||
						flagStr === "yes" ||
						flagStr === "1";

					const btn = document.createElement("div");
					btn.className = "option-block mc-option-btn";

					btn.innerHTML = `
						<div class="option-content">
							<span class="option-letter">${displayLetter}.</span>
							<span>${text}</span>
						</div>
					`;

					/**
					 * Persists the selected option letter and its correctness flag to sessionStorage.
					 *
					 * @returns {void}
					 */
					const saveState = () => {
						try {
							sessionStorage.setItem(
								"notebooklm_sel_opt_" + cardId,
								originalLetter,
							);
							sessionStorage.setItem(
								"notebooklm_sel_corr_" + cardId,
								isCorrect ? "true" : "false",
							);
						} catch (e) {}
					};

					btn.addEventListener("touchstart", saveState, {
						passive: true,
					});
					btn.addEventListener("mousedown", saveState, {
						passive: true,
					});
					btn.addEventListener("click", (e) => {
						saveState();
						flipToBack();
					});

					container.appendChild(btn);
				});
			}

			// HINT TOGGLE
			const hintBtn = document.getElementById("hint-toggle");
			if (hintBtn) {
				hintBtn.addEventListener("click", (e) => {
					e.stopPropagation();
					const isOpen = hBox.classList.contains("is-open");
					hBox.classList.toggle("is-open", !isOpen);
					hintBtn.classList.toggle("hint-active", !isOpen);
					if (!isOpen) {
						triggerMath(hBox);
					}
				});
			}

			// FORCE RENDER MATH
			setTimeout(() => triggerMath(document.body), 100);
		} catch (e) {
			console.log("Template Error:", e);
		}
	})();
</script>
