<link
	href="https://fonts.googleapis.com/icon?family=Material+Icons"
	rel="stylesheet"
/>

<div class="main-wrapper mode-centered">
	<div class="quiz-column">
		<div class="quiz-content-wrapper">
			<div class="question-text" id="q-text"></div>

			<!-- Inline Question Image / Diagram -->
			{{#Image}}
			<div class="question-media" id="q-media">{{Image}}</div>
			{{/Image}}

			<!-- Dynamic Question Interface Container -->
			<div id="front-interactive-area">
				<div class="options-list" id="front-options">
					<div style="color: #666; padding: 20px">Loading...</div>
				</div>
			</div>

			<div class="hint-container">
				<div
					class="hint-btn"
					id="hint-toggle"
					onclick="event.stopPropagation()"
				>
					<span class="material-icons" style="font-size: 18px"
						>lightbulb</span
					>
					Hint
				</div>
				<div class="hint-text-box" id="hint-content"></div>
			</div>
		</div>
	</div>
</div>

<div id="raw-data" style="display: none">
	<div id="d-question">{{Question}}</div>
	<div id="d-hint">{{Hint}}</div>
	{{#Image}}
	<div id="d-image">{{Image}}</div>
	{{/Image}}
	<div id="d-qtype">{{QuestionType}}</div>
	<div id="d-target">{{TargetAnswer}}</div>
	<div id="d-acceptable">{{AcceptableAnswers}}</div>
	<div id="d-rubric">{{Rubric}}</div>
	<div id="d-general-rationale">{{GeneralRationale}}</div>

	<div
		data-opt="A"
		data-text="{{Option1}}"
		data-flag="{{Flag1}}"
		data-reason="{{Rationale1}}"
	></div>
	<div
		data-opt="B"
		data-text="{{Option2}}"
		data-flag="{{Flag2}}"
		data-reason="{{Rationale2}}"
	></div>
	<div
		data-opt="C"
		data-text="{{Option3}}"
		data-flag="{{Flag3}}"
		data-reason="{{Rationale3}}"
	></div>
	<div
		data-opt="D"
		data-text="{{Option4}}"
		data-flag="{{Flag4}}"
		data-reason="{{Rationale4}}"
	></div>
</div>

<script>
	(function () {
		// Prevent AnkiMobile from auto-advancing when tapping anywhere on the card,
		// EXCEPT when interacting with inputs, buttons, options, or hint.
		/**
		 * Intercepts tap/click events to prevent premature flipping on mobile platforms.
		 * Allows interaction only for recognized interactive controls.
		 *
		 * @param {Event} e - The click or touchend event.
		 * @returns {void}
		 */
		const interceptTap = (e) => {
			const isInteractive =
				e.target &&
				(e.target.closest(".option-block") ||
					e.target.closest("#hint-toggle") ||
					e.target.closest(".submit-btn") ||
					e.target.closest(".fitb-input") ||
					e.target.closest(".sa-scratchpad") ||
					e.target.closest(".question-media img") ||
					e.target.closest(".diagram-alt-description"));
			if (!isInteractive) {
				e.stopPropagation();
				if (e.cancelable) e.preventDefault();
			}
		};
		window.addEventListener("click", interceptTap, true);
		window.addEventListener("touchend", interceptTap, true);

		// --- 1. THE TRANSLATOR (Fixes $$ -> \[) ---
		/**
		 * Converts LaTeX math notation ($$ ... $$ and $ ... $) and backtick code snippets
		 * into Anki MathJax delimiters and HTML code tags.
		 *
		 * @param {string} str - Raw input string with math or code markdown.
		 * @returns {string} Sanitized string with MathJax brackets and code tags.
		 */
		function cleanMath(str) {
			if (!str) return "";
			// Convert Block Math: $$ ... $$ -> \[ ... \]
			let s = str.replace(/\$\$(.*?)\$\$/gs, "\\[$1\\]");
			// Convert Inline Math: $ ... $ -> \( ... \)
			s = s.replace(/\$((?:[^$]|\\$)+?)\$/g, "\\($1\\)");
			// Convert Code: `...` -> <code>...</code>
			s = s.replace(
				/`([^`]+)`/g,
				'<code class="latex-snippet">$1</code>',
			);

			// Prevent line breaks before/after narrow inline math (e.g. orphan closing parentheses)
			s = s.replace(
				/\(\s*(\\\([^\n]+?\\\))\s*\)/g,
				'<span class="math-nowrap">($1)</span>',
			);
			s = s.replace(
				/(\\\([^\n]{1,30}?\\\))([)\],.;:!?])/g,
				'<span class="math-nowrap">$1$2</span>',
			);
			s = s.replace(
				/([(\[{])(\\\([^\n]{1,30}?\\\))/g,
				'<span class="math-nowrap">$1$2</span>',
			);
			return s;
		}

		// --- 2. MATH RENDERER ---
		/**
		 * Triggers MathJax typesetting on the specified DOM element.
		 * Supports both MathJax v3 (typesetPromise) and MathJax v2 (Hub.Queue).
		 *
		 * @param {HTMLElement} element - Target container element to typeset.
		 * @returns {void}
		 */
		function triggerMath(element) {
			if (typeof MathJax !== "undefined" && MathJax.typesetPromise) {
				MathJax.typesetPromise([element]).catch((err) => {});
			} else if (typeof MathJax !== "undefined" && MathJax.Hub) {
				MathJax.Hub.Queue(["Typeset", MathJax.Hub, element]);
			}
		}

		// Flip card to back helper
		/**
		 * Dispatches answer revelation command to flip the card to the back side
		 * across Desktop, AnkiMobile, and AnkiDroid platforms.
		 *
		 * @returns {void}
		 */
		function flipToBack() {
			if (typeof pycmd !== "undefined") {
				pycmd("ans");
			} else if (typeof showAnswer !== "undefined") {
				showAnswer();
			} else {
				const ev = document.createEvent("Event");
				ev.initEvent("keypress", true, true);
				ev.which = ev.keyCode = 13;
				document.dispatchEvent(ev);
			}
		}

		try {
			// --- 3. PROCESS QUESTION, MEDIA & HINT ---
			const qRaw = document.getElementById("d-question").innerHTML;
			const hRaw = document.getElementById("d-hint").innerHTML;
			const dImage = document.getElementById("d-image");
			const imgRaw = dImage ? dImage.innerHTML.trim() : "";

			document.getElementById("q-text").innerHTML = cleanMath(qRaw);

			// Render inline image if present
			const mediaBox = document.getElementById("q-media");
			if (mediaBox) {
				if (imgRaw && imgRaw.length > 0) {
					mediaBox.innerHTML = imgRaw;
					mediaBox.style.display = "block";

					const imgEl = mediaBox.querySelector("img");
					if (imgEl && imgEl.alt && imgEl.alt.trim()) {
						const descBox = document.createElement("div");
						descBox.className = "diagram-alt-description";

						const labelSpan = document.createElement("span");
						labelSpan.className = "diagram-alt-label";
						labelSpan.textContent = "Description: ";
						descBox.appendChild(labelSpan);

						const textSpan = document.createElement("span");
						textSpan.textContent = imgEl.alt.trim();
						descBox.appendChild(textSpan);

						mediaBox.appendChild(descBox);

						imgEl.setAttribute("tabindex", "0");
						imgEl.setAttribute("role", "button");
						imgEl.setAttribute("aria-expanded", "false");

						/**
						 * Toggles visibility of the diagram alt text description box.
						 *
						 * @param {Event} evt - Click or keydown event.
						 * @returns {void}
						 */
						const toggleDesc = (evt) => {
							evt.stopPropagation();
							const isShown = descBox.style.display === "block";
							descBox.style.display = isShown ? "none" : "block";
							imgEl.setAttribute(
								"aria-expanded",
								String(!isShown),
							);
						};

						imgEl.addEventListener("click", toggleDesc);
						imgEl.addEventListener("keydown", (evt) => {
							if (evt.key === "Enter" || evt.key === " ") {
								evt.preventDefault();
								toggleDesc(evt);
							}
						});
					}
				} else {
					mediaBox.style.display = "none";
				}
			}

			// Render hint
			const hBox = document.getElementById("hint-content");
			if (hRaw.trim()) {
				hBox.innerHTML = cleanMath(hRaw);
			} else {
				const hBtn = document.getElementById("hint-toggle");
				if (hBtn) hBtn.style.display = "none";
			}

			const qRawForId = document.getElementById("d-question").innerHTML;
			const cardId = qRawForId
				.substring(0, 50)
				.replace(/[^a-zA-Z0-9]/g, "");

			// Determine Question Type
			const rawType = (
				document.getElementById("d-qtype")?.textContent || ""
			)
				.trim()
				.toUpperCase();
			const dataItems = document.querySelectorAll(
				"#raw-data > div[data-opt]",
			);
			const validItems = Array.from(dataItems).filter((item) => {
				const rawText = item.dataset.text || "";
				const rawReason = item.dataset.reason || "";
				return rawText.trim() || rawReason.trim();
			});

			let questionType = rawType;
			if (!questionType) {
				const correctCount = validItems.filter((i) => {
					const f = (i.dataset.flag || "").trim().toLowerCase();
					return f === "true" || f === "yes" || f === "1";
				}).length;
				if (correctCount > 1) {
					questionType = "MULTIPLE_SELECT";
				} else if (validItems.length > 0) {
					questionType = "MULTIPLE_CHOICE";
				} else if (
					document.getElementById("d-target")?.textContent.trim()
				) {
					questionType = "FILL_IN_THE_BLANK";
				} else {
					questionType = "SHORT_ANSWER";
				}
			}

			const interactiveArea = document.getElementById(
				"front-interactive-area",
			);

			// --- 4. RENDER ADAPTIVE INTERACTION BY QUESTION TYPE ---
			if (questionType === "MULTIPLE_SELECT") {
				// MULTIPLE SELECT: Checkboxes with "Check Answer" submit button
				interactiveArea.innerHTML = `
					<div class="options-list" id="front-options"></div>
					<button class="submit-btn" id="ms-submit-btn">Check Answer</button>
				`;
				const container = document.getElementById("front-options");

				// Shuffle options
				for (let i = validItems.length - 1; i > 0; i--) {
					const j = Math.floor(Math.random() * (i + 1));
					[validItems[i], validItems[j]] = [
						validItems[j],
						validItems[i],
					];
				}

				try {
					sessionStorage.setItem(
						"notebooklm_shuffle_" + cardId,
						JSON.stringify(validItems.map((i) => i.dataset.opt)),
					);
				} catch (e) {}

				const selectedOpts = new Set();

				validItems.forEach((item, index) => {
					const originalLetter = item.dataset.opt;
					const displayLetter = String.fromCharCode(65 + index);
					const text = cleanMath(item.dataset.text || "");

					const btn = document.createElement("div");
					btn.className = "option-block ms-option";
					btn.dataset.opt = originalLetter;

					btn.innerHTML = `
						<div class="option-content">
							<span class="ms-checkbox"></span>
							<span class="option-letter">${displayLetter}.</span>
							<span>${text}</span>
						</div>
					`;

					btn.addEventListener("click", (e) => {
						e.stopPropagation();
						if (selectedOpts.has(originalLetter)) {
							selectedOpts.delete(originalLetter);
							btn.classList.remove("is-selected");
						} else {
							selectedOpts.add(originalLetter);
							btn.classList.add("is-selected");
						}
					});

					container.appendChild(btn);
				});

				const submitBtn = document.getElementById("ms-submit-btn");
				submitBtn.addEventListener("click", (e) => {
					e.stopPropagation();
					try {
						sessionStorage.setItem(
							"notebooklm_ms_sel_" + cardId,
							JSON.stringify(Array.from(selectedOpts)),
						);
					} catch (err) {}
					flipToBack();
				});
			} else if (questionType === "FILL_IN_THE_BLANK") {
				// FILL IN THE BLANK: Text input + Check Answer button
				interactiveArea.innerHTML = `
					<div class="fitb-container">
						<input type="text" class="fitb-input" id="fitb-input" placeholder="Type your answer..." autocomplete="off" />
						<button class="submit-btn" id="fitb-submit-btn">Check Answer</button>
					</div>
				`;

				const inputEl = document.getElementById("fitb-input");
				const submitBtn = document.getElementById("fitb-submit-btn");

				/**
				 * Saves the typed fill-in-the-blank response to sessionStorage and flips the card.
				 *
				 * @param {Event} [e] - Optional triggering click or keyboard event.
				 * @returns {void}
				 */
				const doSubmit = (e) => {
					if (e) e.stopPropagation();
					const val = inputEl.value.trim();
					try {
						sessionStorage.setItem(
							"notebooklm_typed_" + cardId,
							val,
						);
					} catch (err) {}
					flipToBack();
				};

				submitBtn.addEventListener("click", doSubmit);
				inputEl.addEventListener("keydown", (e) => {
					if (e.key === "Enter") {
						doSubmit(e);
					}
				});
				// Auto-focus input on desktop
				setTimeout(() => inputEl.focus(), 150);
			} else if (questionType === "SHORT_ANSWER") {
				// SHORT ANSWER: Optional scratchpad + Reveal button
				interactiveArea.innerHTML = `
					<div class="sa-container">
						<textarea class="sa-scratchpad" id="sa-scratchpad" placeholder="Draft your answer here (optional)..." rows="4"></textarea>
						<button class="submit-btn" id="sa-submit-btn">Show Model Answer & Rubric</button>
					</div>
				`;

				const scratchEl = document.getElementById("sa-scratchpad");
				const submitBtn = document.getElementById("sa-submit-btn");

				submitBtn.addEventListener("click", (e) => {
					e.stopPropagation();
					const val = scratchEl.value.trim();
					try {
						sessionStorage.setItem(
							"notebooklm_sa_scratch_" + cardId,
							val,
						);
					} catch (err) {}
					flipToBack();
				});
			} else {
				// --- 4. PROCESS OPTIONS ---
				// MULTIPLE CHOICE: Standard single-choice options
				interactiveArea.innerHTML = `<div class="options-list" id="front-options"></div>`;
				const container = document.getElementById("front-options");

				// Shuffle options randomly
				for (let i = validItems.length - 1; i > 0; i--) {
					const j = Math.floor(Math.random() * (i + 1));
					[validItems[i], validItems[j]] = [
						validItems[j],
						validItems[i],
					];
				}

				try {
					sessionStorage.setItem(
						"notebooklm_shuffle_" + cardId,
						JSON.stringify(validItems.map((i) => i.dataset.opt)),
					);
				} catch (e) {}

				validItems.forEach((item, index) => {
					const originalLetter = item.dataset.opt;
					const displayLetter = String.fromCharCode(65 + index);
					const rawText = item.dataset.text || "";

					// Apply Translator
					const text = cleanMath(rawText);
					const flagStr = (item.dataset.flag || "")
						.trim()
						.toLowerCase();
					const isCorrect =
						flagStr === "true" ||
						flagStr === "yes" ||
						flagStr === "1";

					const btn = document.createElement("div");
					btn.className = "option-block";

					btn.innerHTML = `
						<div class="option-content">
							<span class="option-letter">${displayLetter}.</span>
							<span>${text}</span>
						</div>
					`;

					/**
					 * Persists the selected option letter and its correctness flag to sessionStorage.
					 *
					 * @returns {void}
					 */
					const saveState = () => {
						try {
							sessionStorage.setItem(
								"notebooklm_sel_opt_" + cardId,
								originalLetter,
							);
							sessionStorage.setItem(
								"notebooklm_sel_corr_" + cardId,
								isCorrect ? "true" : "false",
							);
						} catch (e) {}
					};

					btn.addEventListener("touchstart", saveState, {
						passive: true,
					});
					btn.addEventListener("mousedown", saveState, {
						passive: true,
					});
					btn.addEventListener("click", (e) => {
						saveState();
						flipToBack();
					});

					container.appendChild(btn);
				});
			}

			// HINT TOGGLE
			const hintBtn = document.getElementById("hint-toggle");
			if (hintBtn) {
				hintBtn.addEventListener("click", (e) => {
					e.stopPropagation();
					const isHidden =
						window.getComputedStyle(hBox).display === "none";
					if (isHidden) {
						hBox.style.display = "block";
						hintBtn.classList.add("hint-active");
						triggerMath(hBox);
					} else {
						hBox.style.display = "none";
						hintBtn.classList.remove("hint-active");
					}
				});
			}

			// FORCE RENDER MATH
			setTimeout(() => triggerMath(document.body), 100);
		} catch (e) {
			console.log("Template Error:", e);
		}
	})();
</script>
