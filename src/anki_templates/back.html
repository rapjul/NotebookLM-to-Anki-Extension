<!-- -------------------- NotebookLM Template: Start -------------------- -->
<div id="layout-root" class="main-wrapper mode-centered">
	<div class="quiz-column">
		<div class="quiz-content-wrapper">
			<div class="question-text" id="back-q-text"></div>

			<!-- Inline Question Image / Diagram -->
			{{#Image}}
			<div class="question-media" id="back-q-media">{{Image}}</div>
			{{/Image}}

			<!-- Dynamic Feedback & Results Area -->
			<div id="back-interactive-area">
				<div class="options-list" id="back-options"></div>
			</div>

			<!-- Primary Action / Continue Button -->
			<div id="action-container"></div>
		</div>
	</div>
</div>

<div id="back-data" class="is-hidden">
	<div id="d-question">{{Question}}</div>
	{{#Image}}
	<div id="d-image">{{Image}}</div>
	{{/Image}}
	<div id="d-qtype">{{QuestionType}}</div>
	<div id="d-target">{{TargetAnswer}}</div>
	<div id="d-acceptable">{{AcceptableAnswers}}</div>
	<div id="d-rubric">{{Rubric}}</div>
	<div id="d-general-rationale">{{GeneralRationale}}</div>

	<div
		data-opt="A"
		data-text="{{Option1}}"
		data-flag="{{Flag1}}"
		data-reason="{{Rationale1}}"
	></div>
	<div
		data-opt="B"
		data-text="{{Option2}}"
		data-flag="{{Flag2}}"
		data-reason="{{Rationale2}}"
	></div>
	<div
		data-opt="C"
		data-text="{{Option3}}"
		data-flag="{{Flag3}}"
		data-reason="{{Rationale3}}"
	></div>
	<div
		data-opt="D"
		data-text="{{Option4}}"
		data-flag="{{Flag4}}"
		data-reason="{{Rationale4}}"
	></div>
</div>

<script>
	(function () {
		// Defensive cleanup of any front-side tap and keyboard viewport listeners in persistent WKWebView
		window.__notebooklmAllowHostFlip = true;
		if (window.__notebooklmFrontTapHandler) {
			window.removeEventListener(
				"click",
				window.__notebooklmFrontTapHandler,
				true,
			);
			window.removeEventListener(
				"touchend",
				window.__notebooklmFrontTapHandler,
				true,
			);
			window.__notebooklmFrontTapHandler = null;
		}
		if (window.__notebooklmViewportHandler && window.visualViewport) {
			window.visualViewport.removeEventListener(
				"resize",
				window.__notebooklmViewportHandler,
			);
			window.__notebooklmViewportHandler = null;
		}
		if (window.__notebooklmWindowResizeHandler) {
			window.removeEventListener(
				"resize",
				window.__notebooklmWindowResizeHandler,
			);
			window.__notebooklmWindowResizeHandler = null;
		}

		// Manage background taps: prevent option clicks from natively advancing on mobile,
		// but allow background and continue button clicks to natively advance.
		setTimeout(() => {
			const wrapper = document.querySelector(".main-wrapper");
			if (wrapper) {
				/**
				 * Intercepts tap/click events on the back side of the card.
				 * Prevents option clicks from prematurely advancing on mobile, while allowing
				 * background taps to trigger card grading.
				 *
				 * @param {Event} e - Click or touch event.
				 * @returns {void}
				 */
				const intercept = (e) => {
					const isInteractive =
						e.target.closest(".option-block") ||
						e.target.closest(".fitb-input") ||
						e.target.closest(".sa-scratchpad") ||
						e.target.closest(".question-media img") ||
						e.target.closest(".diagram-alt-description") ||
						e.target.closest(".continue-btn") ||
						e.target.closest("#action-container") ||
						e.target.closest(".self-grade-container");
					if (isInteractive) {
						e.stopPropagation();
					} else {
						// For background taps, simulate continue button click for Desktop/AnkiDroid.
						// We do NOT stop propagation so AnkiMobile natively grades the card.
						if (!e.target.closest(".continue-btn")) {
							const continueBtn =
								document.querySelector(".continue-btn");
							if (continueBtn) {
								continueBtn.click();
							}
						}
					}
				};
				wrapper.addEventListener("click", intercept);
				wrapper.addEventListener("touchend", intercept);
			}
		}, 0);

		/**
		 * Converts LaTeX math notation ($$ ... $$ and $ ... $) and backtick code snippets
		 * into Anki MathJax delimiters and HTML code tags.
		 *
		 * @param {string} str - Raw input string with math or code markdown.
		 * @returns {string} Sanitized string with MathJax brackets and code tags.
		 */
		function cleanMath(str) {
			if (!str) return "";
			let s = str.replace(/\$\$(.*?)\$\$/gs, "\\[$1\\]");
			s = s.replace(/\$((?:[^$]|\\$)+?)\$/g, "\\($1\\)");
			s = s.replace(
				/`([^`]+)`/g,
				'<code class="latex-snippet">$1</code>',
			);

			// Prevent line breaks before/after narrow inline math (e.g. orphan closing parentheses)
			s = s.replace(
				/\(\s*(\\\([^\n]+?\\\))\s*\)/g,
				'<span class="math-nowrap">($1)</span>',
			);
			s = s.replace(
				/(\\\([^\n]{1,30}?\\\))([)\],.;:!?])/g,
				'<span class="math-nowrap">$1$2</span>',
			);
			s = s.replace(
				/([(\[{])(\\\([^\n]{1,30}?\\\))/g,
				'<span class="math-nowrap">$1$2</span>',
			);
			return s;
		}

		/**
		 * Triggers MathJax typesetting on the specified DOM element.
		 * Supports both MathJax v3 (typesetPromise) and MathJax v2 (Hub.Queue).
		 *
		 * @param {HTMLElement} element - Target container element to typeset.
		 * @returns {void}
		 */
		function triggerMath(element) {
			if (typeof MathJax !== "undefined" && MathJax.typesetPromise) {
				MathJax.typesetPromise([element]).catch((err) => {});
			} else if (typeof MathJax !== "undefined" && MathJax.Hub) {
				MathJax.Hub.Queue(["Typeset", MathJax.Hub, element]);
			}
		}

		/**
		 * Normalizes a fill-in-the-blank user response or accepted answer string
		 * by trimming, lowercasing, and stripping surrounding math dollar delimiters.
		 *
		 * @param {string|null|undefined} str - Raw answer string.
		 * @returns {string} Normalized lowercase string.
		 */
		function normalizeBlank(str) {
			if (!str) return "";
			return String(str)
				.trim()
				.toLowerCase()
				.replace(/^\$+|\$+$/g, "")
				.trim();
		}

		/**
		 * Determines whether the card is being rendered on a mobile client.
		 * Checks for AnkiMobile (iPhone/iPad), AnkiDroid, and mobile browser characteristics.
		 *
		 * @returns {boolean} True if running on AnkiMobile, AnkiDroid, or mobile browser.
		 */
		function isMobilePlatform() {
			const rootClassList = document.documentElement.classList;
			const bodyClassList = document.body ? document.body.classList : null;
			const hasMobileClass =
				rootClassList.contains("mobile") ||
				rootClassList.contains("ipad") ||
				rootClassList.contains("iphone") ||
				rootClassList.contains("ios") ||
				rootClassList.contains("android") ||
				Boolean(
					bodyClassList &&
						(bodyClassList.contains("mobile") ||
							bodyClassList.contains("ipad") ||
							bodyClassList.contains("iphone") ||
							bodyClassList.contains("ios") ||
							bodyClassList.contains("android")),
				);

			const hasAnkiDroid =
				typeof AnkiDroidJS !== "undefined" ||
				typeof ankiAnswerEase1 === "function" ||
				typeof buttonAnswerEase1 === "function";

			const hasAnkiMobile = Boolean(
				(window.webkit &&
					window.webkit.messageHandlers &&
					(window.webkit.messageHandlers.cb ||
						window.webkit.messageHandlers.bridgeCommand)) ||
					window.anki,
			);

			const isTouchScreen = Boolean(
				(typeof navigator !== "undefined" &&
					navigator.maxTouchPoints > 1 &&
					(navigator.platform === "MacIntel" ||
						/Macintosh/i.test(navigator.userAgent))) ||
					(typeof window !== "undefined" &&
						typeof window.orientation !== "undefined"),
			);

			const isMobileUserAgent =
				typeof navigator !== "undefined" &&
				/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

			return Boolean(
				hasMobileClass ||
					hasAnkiDroid ||
					hasAnkiMobile ||
					isTouchScreen ||
					isMobileUserAgent,
			);
		}

		/**
		 * Records physical keyboard usage in sessionStorage to persist hardware keyboard awareness.
		 *
		 * @param {KeyboardEvent} e - Keydown event.
		 * @returns {void}
		 */
		const recordBackKeyboardUsage = (e) => {
			if (e.key) {
				try {
					sessionStorage.setItem("notebooklm_has_keyboard", "true");
				} catch (err) {}
			}
		};
		window.addEventListener("keydown", recordBackKeyboardUsage);

		/**
		 * Determines whether keyboard shortcut hints should be displayed on action buttons.
		 * Displays hints on desktop platforms, or on mobile/iPad when a fine pointer
		 * (Magic Keyboard / mouse) or physical keypress has been detected in this session.
		 *
		 * @returns {boolean} True if keyboard hints should be shown.
		 */
		function shouldShowKeyboardHints() {
			if (!isMobilePlatform()) {
				return true;
			}
			const hasFinePointer = Boolean(
				typeof window !== "undefined" &&
					window.matchMedia &&
					window.matchMedia("(pointer: fine)").matches,
			);
			let sessionKeyDetected = false;
			try {
				sessionKeyDetected =
					sessionStorage.getItem("notebooklm_has_keyboard") === "true";
			} catch (e) {}
			return Boolean(hasFinePointer || sessionKeyDetected);
		}

		/**
		 * Dispatches answer grading command to Anki (Good for correct, Again for incorrect)
		 * across Desktop, AnkiMobile, AnkiDroid, and Web platforms.
		 *
		 * @param {boolean} isCorrect - True if user answered correctly (Good), false if incorrect (Again).
		 * @returns {void}
		 */
		function gradeCard(isCorrect) {
			const easeCmd = isCorrect ? "ease3" : "ease1";

			// 1. Modern Anki Desktop & Webview bridgeCommand
			if (typeof bridgeCommand === "function") {
				bridgeCommand(easeCmd);
				return;
			}

			// 2. Anki Desktop legacy pycmd
			if (typeof pycmd !== "undefined") {
				pycmd(easeCmd);
				return;
			}

			// 3. AnkiDroid (direct global bridge or window.AnkiDroidJS)
			if (
				typeof ankiAnswerEase3 === "function" ||
				typeof ankiAnswerEase1 === "function"
			) {
				if (isCorrect && typeof ankiAnswerEase3 === "function") {
					ankiAnswerEase3();
				} else if (!isCorrect && typeof ankiAnswerEase1 === "function") {
					ankiAnswerEase1();
				}
				return;
			}
			if (
				typeof buttonAnswerEase3 === "function" ||
				typeof buttonAnswerEase1 === "function"
			) {
				if (isCorrect && typeof buttonAnswerEase3 === "function") {
					buttonAnswerEase3();
				} else if (!isCorrect && typeof buttonAnswerEase1 === "function") {
					buttonAnswerEase1();
				}
				return;
			}
			if (typeof AnkiDroidJS !== "undefined") {
				if (
					isCorrect &&
					typeof AnkiDroidJS.ankiAnswerEase3 === "function"
				) {
					AnkiDroidJS.ankiAnswerEase3();
					return;
				} else if (
					!isCorrect &&
					typeof AnkiDroidJS.ankiAnswerEase1 === "function"
				) {
					AnkiDroidJS.ankiAnswerEase1();
					return;
				}
			}

			// 4. AnkiMobile (iOS WebKit bridgeCommand)
			if (
				window.webkit &&
				window.webkit.messageHandlers &&
				window.webkit.messageHandlers.bridgeCommand
			) {
				try {
					window.webkit.messageHandlers.bridgeCommand.postMessage(easeCmd);
					return;
				} catch (err) {}
			}

			// 5. AnkiMobile (iOS WebKit callback bridge via ankitap gesture)
			if (
				window.webkit &&
				window.webkit.messageHandlers &&
				window.webkit.messageHandlers.cb
			) {
				try {
					window.webkit.messageHandlers.cb.postMessage(
						JSON.stringify({
							scheme: "ankitap",
							msg: isCorrect ? "midRight" : "midLeft",
						}),
					);
					return;
				} catch (err) {}
			}
			if (window.anki && typeof window.sendMessage2 === "function") {
				try {
					window.sendMessage2(
						"ankitap",
						isCorrect ? "midRight" : "midLeft",
					);
					return;
				} catch (err) {}
			}

			// 6. Fallback: Keyboard event dispatch (Desktop webviews / AnkiWeb)
			try {
				const keyCode = isCorrect ? 51 : 49; // '3' or '1'
				const keyChar = isCorrect ? "3" : "1";
				const ev = new KeyboardEvent("keydown", {
					key: keyChar,
					code: isCorrect ? "Digit3" : "Digit1",
					which: keyCode,
					keyCode: keyCode,
					bubbles: true,
					cancelable: true,
				});
				document.dispatchEvent(ev);
			} catch (e) {}
		}

		/**
		 * Renders the continue/grading action button into the action container.
		 *
		 * @param {boolean} isCorrect - Whether the user got the question right.
		 * @param {string|null} [label=null] - Optional custom text label for the button.
		 * @param {boolean} [isSkipped=false] - Whether the question was skipped.
		 * @returns {void}
		 */
		function renderContinueButton(
			isCorrect,
			label = null,
			isSkipped = false,
		) {
			const actionContainer = document.getElementById("action-container");
			if (!actionContainer) return;

			actionContainer.innerHTML = "";

			// On mobile clients (e.g. AnkiMobile), do not render in-card continue button.
			// Users rely directly on the host application's native bottom grading buttons.
			if (isMobilePlatform()) {
				return;
			}

			const continueBtn = document.createElement("button");
			continueBtn.type = "button";
			const btnStateClass = isCorrect
				? "btn-correct"
				: isSkipped
					? "btn-skipped"
					: "btn-wrong";
			continueBtn.className = `continue-btn tappable ${btnStateClass}`;

			const showHints = shouldShowKeyboardHints();
			let defaultLabel = "";
			if (isCorrect) {
				defaultLabel = showHints
					? "Good (Mark Correct) [Space / 3]"
					: "Good (Mark Correct)";
			} else if (isSkipped) {
				defaultLabel = showHints
					? "Again (Mark Skipped) [1]"
					: "Again (Mark Skipped)";
			} else {
				defaultLabel = showHints
					? "Again (Mark Incorrect) [1]"
					: "Again (Mark Incorrect)";
			}

			continueBtn.textContent = label || defaultLabel;

			let lastActionTime = 0;
			/**
			 * Handles tap and click events on the continue button with ghost-click suppression.
			 *
			 * @param {Event} e - Touch or click event.
			 * @returns {void}
			 */
			const handleAction = (e) => {
				const now = Date.now();
				if (now - lastActionTime < 400) {
					if (e.cancelable) e.preventDefault();
					e.stopPropagation();
					return;
				}
				lastActionTime = now;
				e.stopPropagation();
				gradeCard(isCorrect);
			};

			continueBtn.onclick = handleAction;
			continueBtn.addEventListener("touchend", handleAction);
			continueBtn.addEventListener("click", handleAction);
			actionContainer.appendChild(continueBtn);
		}

		// SVG Evaluation Status Icons
		// Material Design 'check' icon: https://fonts.google.com/icons?selected=Material+Symbols+Outlined:check
		const iconCheck = `<svg class="status-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
		// Material Design 'close' icon: https://fonts.google.com/icons?selected=Material+Symbols+Outlined:close
		const iconClose = `<svg class="status-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`;
		// Material Design 'fast_forward' icon: https://fonts.google.com/icons?selected=Material+Symbols+Outlined:fast_forward
		const iconSkip = `<svg class="status-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>`;

		/**
		 * @typedef {Object} OptionEvaluation
		 * @property {string} stateClass - Visual state CSS class for the option block.
		 * @property {string} headerClass - CSS class for the feedback status header.
		 * @property {string} icon - Inline SVG markup for the feedback status icon.
		 * @property {string} label - Human-readable status label text.
		 */

		/**
		 * Evaluates a multi-select option and returns its visual state class, icon, and feedback header label.
		 *
		 * @param {object} params - Evaluation parameters.
		 * @param {boolean} params.isCorrect - Whether this option is factually correct.
		 * @param {boolean} params.userSelected - Whether the user selected this option.
		 * @param {boolean} params.hasInteraction - Whether user submitted choices before revealing.
		 * @returns {OptionEvaluation} Evaluation metadata.
		 */
		function evaluateMultiSelectOption({
			isCorrect,
			userSelected,
			hasInteraction,
		}) {
			if (!hasInteraction) {
				return isCorrect
					? {
							stateClass: "state-correct",
							headerClass: "thats-right",
							icon: iconCheck,
							label: "Correct option",
						}
					: {
							stateClass: "state-incorrect-unselected",
							headerClass: "thats-incorrect-unselected",
							icon: iconClose,
							label: "Incorrect option",
						};
			}

			if (isCorrect && userSelected) {
				return {
					stateClass: "state-correct",
					headerClass: "thats-right",
					icon: iconCheck,
					label: "Correct selection (Your answer)",
				};
			}
			if (isCorrect && !userSelected) {
				return {
					stateClass: "state-missed",
					headerClass: "thats-missed",
					icon: iconCheck,
					label: "Missed correct option",
				};
			}
			if (!isCorrect && userSelected) {
				return {
					stateClass: "state-wrong",
					headerClass: "not-quite",
					icon: iconClose,
					label: "Incorrect selection (Your answer)",
				};
			}
			return {
				stateClass: "state-incorrect-unselected",
				headerClass: "thats-incorrect-unselected",
				icon: iconClose,
				label: "Incorrect option",
			};
		}

		/**
		 * Evaluates a single-choice option and returns its visual state class, icon, and feedback label.
		 *
		 * @param {object} params - Evaluation parameters.
		 * @param {boolean} params.isCorrect - Whether this option is factually correct.
		 * @param {boolean} params.isSelected - Whether this option was selected by the user.
		 * @param {boolean} params.userWasCorrect - Whether the user's selected choice overall was correct.
		 * @returns {OptionEvaluation} Evaluation metadata.
		 */
		function evaluateSingleChoiceOption({
			isCorrect,
			isSelected,
			userWasCorrect,
		}) {
			let stateClass = "state-dimmed";
			if (isCorrect) {
				stateClass = "state-correct";
			} else if (isSelected) {
				stateClass = "state-wrong";
			}

			let headerClass = "";
			let icon = "";
			let label = "";

			if (isCorrect) {
				headerClass = "thats-right";
				icon = iconCheck;
				if (isSelected) {
					label = "That's right! (Your answer)";
				} else if (userWasCorrect) {
					label = "This is also right!";
				} else {
					label = "Right answer";
				}
			} else if (isSelected) {
				headerClass = "not-quite";
				icon = iconClose;
				label = "Not quite (Your answer)";
			}

			return { stateClass, headerClass, icon, label };
		}

		/**
		 * Renders HTML markup for a feedback review header.
		 *
		 * @param {string} headerClass - CSS class for the header container.
		 * @param {string} icon - SVG icon markup.
		 * @param {string} label - Human-readable status label.
		 * @returns {string} HTML markup string.
		 */
		function renderFeedbackHeader(headerClass, icon, label) {
			if (!headerClass || !label) return "";
			return `<div class="${headerClass}">${icon}<span>${label}</span></div>`;
		}

		try {
			// Translate Question
			const qRaw = document.getElementById("d-question").innerHTML;
			document.getElementById("back-q-text").innerHTML = cleanMath(qRaw);

			// Render inline image if present
			const dImage = document.getElementById("d-image");
			const imgRaw = dImage ? dImage.innerHTML.trim() : "";
			const mediaBox = document.getElementById("back-q-media");
			if (mediaBox) {
				const hasImage = Boolean(imgRaw && imgRaw.length > 0);
				mediaBox.classList.toggle("is-visible", hasImage);
				if (hasImage) {
					mediaBox.innerHTML = imgRaw;

					const imgEl = mediaBox.querySelector("img");
					if (imgEl && imgEl.alt && imgEl.alt.trim()) {
						const descBox = document.createElement("div");
						descBox.className = "diagram-alt-description";

						const labelSpan = document.createElement("span");
						labelSpan.className = "diagram-alt-label";
						labelSpan.textContent = "Description: ";
						descBox.appendChild(labelSpan);

						const textSpan = document.createElement("span");
						textSpan.textContent = imgEl.alt.trim();
						descBox.appendChild(textSpan);

						mediaBox.appendChild(descBox);

						imgEl.setAttribute("tabindex", "0");
						imgEl.setAttribute("role", "button");
						imgEl.setAttribute("aria-expanded", "false");

						/**
						 * Toggles visibility of the diagram alt text description box.
						 *
						 * @param {Event} evt - Click or keydown event.
						 * @returns {void}
						 */
						const toggleDesc = (evt) => {
							evt.stopPropagation();
							const isShown = descBox.classList.contains("is-open");
							descBox.classList.toggle("is-open", !isShown);
							imgEl.setAttribute(
								"aria-expanded",
								String(!isShown),
							);
						};

						imgEl.addEventListener("click", toggleDesc);
						imgEl.addEventListener("keydown", (evt) => {
							if (evt.key === "Enter" || evt.key === " ") {
								evt.preventDefault();
								toggleDesc(evt);
							}
						});
					}
				}
			}

			const qRawForId = document.getElementById("d-question").innerHTML;
			const cardId = qRawForId
				.substring(0, 50)
				.replace(/[^a-zA-Z0-9]/g, "");

			// Determine Question Type
			const rawType = (
				document.getElementById("d-qtype")?.textContent || ""
			)
				.trim()
				.toUpperCase();
			const dataItems = document.querySelectorAll(
				"#back-data > div[data-opt]",
			);
			const validItems = Array.from(dataItems).filter((item) => {
				const rawText = item.dataset.text || "";
				const rawReason = item.dataset.reason || "";
				return rawText.trim() || rawReason.trim();
			});

			let questionType = rawType;
			if (!questionType) {
				const correctCount = validItems.filter((i) => {
					const f = (i.dataset.flag || "").trim().toLowerCase();
					return f === "true" || f === "yes" || f === "1";
				}).length;
				if (correctCount > 1) {
					questionType = "MULTIPLE_SELECT";
				} else if (validItems.length > 0) {
					questionType = "MULTIPLE_CHOICE";
				} else if (
					document.getElementById("d-target")?.textContent.trim()
				) {
					questionType = "FILL_IN_THE_BLANK";
				} else {
					questionType = "SHORT_ANSWER";
				}
			}

			// Add question type scope class to the main wrapper
			const wrapper = document.querySelector(".main-wrapper");
			if (wrapper) {
				wrapper.classList.add(
					"qtype-" + questionType.toLowerCase().replace(/_/g, "-"),
				);
			}

			const interactiveArea = document.getElementById(
				"back-interactive-area",
			);

			// --- MULTIPLE SELECT FEEDBACK ---
			if (questionType === "MULTIPLE_SELECT") {
				let selectedOpts = [];
				let hasInteraction = false;
				try {
					const stored = sessionStorage.getItem(
						"notebooklm_ms_sel_" + cardId,
					);
					if (stored !== null) {
						selectedOpts = JSON.parse(stored);
						hasInteraction = true;
					}
					sessionStorage.removeItem("notebooklm_ms_sel_" + cardId);
				} catch (e) {}

				const totalCorrect = validItems.filter((i) => {
					const f = (i.dataset.flag || "").trim().toLowerCase();
					return f === "true" || f === "yes" || f === "1";
				}).length;

				const correctSelected = validItems.filter((i) => {
					const f = (i.dataset.flag || "").trim().toLowerCase();
					const isCorr = f === "true" || f === "yes" || f === "1";
					return isCorr && selectedOpts.includes(i.dataset.opt);
				}).length;

				const wrongSelected = validItems.filter((i) => {
					const f = (i.dataset.flag || "").trim().toLowerCase();
					const isCorr = f === "true" || f === "yes" || f === "1";
					return !isCorr && selectedOpts.includes(i.dataset.opt);
				}).length;

				const isFullyCorrect =
					hasInteraction &&
					correctSelected === totalCorrect &&
					wrongSelected === 0;

				const pillText = hasInteraction
					? `${correctSelected}/${totalCorrect} Correct ${isFullyCorrect ? "(Good)" : "(Again)"}`
					: `Select all that apply (${totalCorrect} correct)`;

				const pillHtml = `
					<div class="score-pill-container">
						<div class="score-pill ${isFullyCorrect || !hasInteraction ? "pill-correct" : "pill-wrong"}">
							${pillText}
						</div>
					</div>
				`;

				interactiveArea.innerHTML = `
					${pillHtml}
					<div class="options-list" id="back-options"></div>
				`;

				const container = document.getElementById("back-options");

				// Retrieve shuffle order
				let orderedItems = validItems;
				try {
					const storedOrder = sessionStorage.getItem(
						"notebooklm_shuffle_" + cardId,
					);
					if (storedOrder) {
						const shuffleKeys = JSON.parse(storedOrder);
						const temp = [];
						shuffleKeys.forEach((k) => {
							const found = validItems.find(
								(i) => i.dataset.opt === k,
							);
							if (found) temp.push(found);
						});
						if (temp.length === validItems.length)
							orderedItems = temp;
					}
					sessionStorage.removeItem("notebooklm_shuffle_" + cardId);
				} catch (e) {}

				orderedItems.forEach((item, index) => {
					const originalLetter = item.dataset.opt;
					const displayLetter = String.fromCharCode(65 + index);
					const text = cleanMath(item.dataset.text || "");
					const reason = cleanMath(item.dataset.reason || "");
					const flagStr = (item.dataset.flag || "")
						.trim()
						.toLowerCase();
					const isCorrect =
						flagStr === "true" ||
						flagStr === "yes" ||
						flagStr === "1";
					const userSelected =
						hasInteraction && selectedOpts.includes(originalLetter);

					const block = document.createElement("div");
					block.className = "option-block";

					const evalResult = evaluateMultiSelectOption({
						isCorrect,
						userSelected,
						hasInteraction,
					});

					block.classList.add(evalResult.stateClass);
					const headerHtml = renderFeedbackHeader(
						evalResult.headerClass,
						evalResult.icon,
						evalResult.label,
					);

					const rationaleContent = reason.trim()
						? `<div class="rationale-text">${reason}</div>`
						: "";
					const feedbackHtml =
						headerHtml || rationaleContent
							? `
						<div class="feedback-section is-revealed">
							${headerHtml}
							${rationaleContent}
						</div>
					`
							: "";

					block.innerHTML = `
						<div class="option-content">
							<span class="option-letter">${displayLetter}.</span>
							<span>${text}</span>
						</div>
						${feedbackHtml}
					`;

					container.appendChild(block);
				});

				renderContinueButton(isFullyCorrect);
			} else if (questionType === "FILL_IN_THE_BLANK") {
				// --- FILL IN THE BLANK FEEDBACK ---
				let typed = "";
				try {
					typed =
						sessionStorage.getItem("notebooklm_typed_" + cardId) ||
						"";
					sessionStorage.removeItem("notebooklm_typed_" + cardId);
				} catch (e) {}

				const targetAnswer = (
					document.getElementById("d-target")?.textContent || ""
				).trim();
				const acceptableStr = (
					document.getElementById("d-acceptable")?.textContent || ""
				).trim();
				const generalRationale = (
					document.getElementById("d-general-rationale")
						?.textContent || ""
				).trim();

				const acceptedList = [targetAnswer, ...acceptableStr.split(",")]
					.map(normalizeBlank)
					.filter((s) => s.length > 0);

				const normTyped = normalizeBlank(typed);
				const isSkipped = normTyped.length === 0;
				const isCorrect =
					!isSkipped && acceptedList.includes(normTyped);

				const cardClass = isCorrect
					? "card-correct"
					: isSkipped
						? "card-skipped"
						: "card-wrong";
				const headerIcon = isCorrect
					? iconCheck
					: isSkipped
						? iconSkip
						: iconClose;
				const headerText = isCorrect
					? "That's right!"
					: isSkipped
						? "Skipped"
						: "Not quite";

				const feedbackCard = `
					<div class="feedback-card ${cardClass}">
						<div class="feedback-header">
							${headerIcon}
							<span>${headerText}</span>
						</div>
						<div class="answer-row">
							<span class="answer-label">Your answer:</span>
							<span class="answer-value">${typed || "<i>(No response entered)</i>"}</span>
						</div>
						${
							!isCorrect && targetAnswer
								? `
						<div class="answer-row">
							<span class="answer-label">Accepted answer:</span>
							<span class="answer-value">${cleanMath(targetAnswer)}</span>
						</div>
						`
								: ""
						}
					</div>
				`;

				const rationaleCard = generalRationale
					? `
					<div class="general-rationale-box">
						<div class="rationale-heading">Explanation</div>
						<div>${cleanMath(generalRationale)}</div>
					</div>
				`
					: "";

				interactiveArea.innerHTML = feedbackCard + rationaleCard;
				renderContinueButton(
					isCorrect,
					null,
					isSkipped,
				);
			} else if (questionType === "SHORT_ANSWER") {
				// --- SHORT ANSWER FEEDBACK ---
				let scratch = "";
				try {
					scratch =
						sessionStorage.getItem(
							"notebooklm_sa_scratch_" + cardId,
						) || "";
					sessionStorage.removeItem(
						"notebooklm_sa_scratch_" + cardId,
					);
				} catch (e) {}

				const targetAnswer = (
					document.getElementById("d-target")?.textContent || ""
				).trim();
				const rubric = (
					document.getElementById("d-rubric")?.textContent || ""
				).trim();
				const generalRationale = (
					document.getElementById("d-general-rationale")
						?.textContent || ""
				).trim();

				const scratchHtml = scratch
					? `
					<div class="sa-user-scratch">
						<div class="sa-section-title">Your Drafted Answer</div>
						<div class="sa-scratch-text">${scratch}</div>
					</div>
				`
					: "";

				const modelAnswerHtml = targetAnswer
					? `
					<div class="sa-model-answer">
						<div class="sa-section-title">Model Answer</div>
						<div class="sa-model-text">${cleanMath(targetAnswer)}</div>
					</div>
				`
					: "";

				// Parse rubric into interactive checklist items and misconceptions
				const rubricLines = rubric
					.split("\n")
					.map((l) => l.trim())
					.filter(Boolean);
				const checkItems = [];
				const miscItems = [];
				const otherItems = [];

				for (const line of rubricLines) {
					if (line.startsWith("•") || line.startsWith("-")) {
						const cleaned = line.replace(/^[•\-]\s*/, "");
						checkItems.push(cleaned);
					} else if (line.startsWith("⚠️")) {
						const cleaned = line.replace(/^⚠️\s*/, "");
						miscItems.push(cleaned);
					} else {
						otherItems.push(line);
					}
				}

				let rubricContentHtml = "";
				if (checkItems.length > 0) {
					rubricContentHtml += `
						<div class="rubric-checklist">
							${checkItems
								.map(
									(item, idx) => `
								<label class="rubric-item" id="rubric-item-${idx}">
									<input type="checkbox" class="rubric-checkbox" data-idx="${idx}" />
									<span class="rubric-text">${cleanMath(item)}</span>
								</label>
							`,
								)
								.join("")}
						</div>
					`;
				}
				if (otherItems.length > 0) {
					rubricContentHtml += `<div class="rubric-text rubric-text-secondary">${cleanMath(otherItems.join("<br>"))}</div>`;
				}

				const rubricHtml =
					checkItems.length > 0 || otherItems.length > 0
						? `
					<div class="sa-rubric">
						<div class="sa-section-title">Grading Rubric & Key Points</div>
						${rubricContentHtml}
					</div>
				`
						: "";

				const miscHtml =
					miscItems.length > 0
						? `
					<div class="sa-misconceptions">
						<div class="sa-misconceptions-heading">⚠️ Common Pitfalls & Misconceptions</div>
						<div class="sa-misconceptions-body">${cleanMath(miscItems.join("<br>"))}</div>
					</div>
				`
						: "";

				const rationaleHtml = generalRationale
					? `
					<div class="general-rationale-box">
						<div class="rationale-heading">Explanation</div>
						<div>${cleanMath(generalRationale)}</div>
					</div>
				`
					: "";

				interactiveArea.innerHTML =
					scratchHtml +
					modelAnswerHtml +
					rubricHtml +
					miscHtml +
					rationaleHtml;

				// Attach interactive checkbox listeners
				const checkBoxes =
					interactiveArea.querySelectorAll(".rubric-checkbox");
				checkBoxes.forEach((cb) => {
					cb.addEventListener("change", () => {
						const parent = cb.closest(".rubric-item");
						if (parent) {
							if (cb.checked) {
								parent.classList.add("rubric-checked");
							} else {
								parent.classList.remove("rubric-checked");
							}
						}
					});
				});

				// Self-Grade Action Buttons (Desktop only; on mobile, users grade via native bottom bar)
				const actionContainer =
					document.getElementById("action-container");
				if (actionContainer && !isMobilePlatform()) {
					const showHints = shouldShowKeyboardHints();
					const againLabel = showHints
						? "Again (Review Later) [1]"
						: "Again (Review Later)";
					const goodLabel = showHints
						? "Good (Understood) [Space / 3]"
						: "Good (Understood)";

					actionContainer.innerHTML = `
						<div class="self-grade-container">
							<div class="self-grade-title">How well did your response match the rubric?</div>
							<div class="self-grade-buttons">
								<button type="button" class="continue-btn tappable btn-wrong" id="sa-btn-again">${againLabel}</button>
								<button type="button" class="continue-btn tappable btn-correct" id="sa-btn-good">${goodLabel}</button>
							</div>
						</div>
					`;

					/**
					 * Keyboard shortcut listener for rapid self-grading.
					 *
					 * @param {KeyboardEvent} e - Keydown event.
					 * @returns {void}
					 */
					const onSaKeyDown = (e) => {
						if (e.key === "1") {
							window.removeEventListener("keydown", onSaKeyDown);
							gradeCard(false);
						} else if (e.key === "3" || e.code === "Space") {
							window.removeEventListener("keydown", onSaKeyDown);
							gradeCard(true);
						}
					};
					window.addEventListener("keydown", onSaKeyDown);

					const saBtnAgain = document.getElementById("sa-btn-again");
					const saBtnGood = document.getElementById("sa-btn-good");

					let saLastActionTime = 0;
					/**
					 * Handles click and touch interactions for short answer self-grading.
					 *
					 * @param {boolean} markGood - True for Good, false for Again.
					 * @param {Event} e - Click or touch event.
					 * @returns {void}
					 */
					const handleSaGrade = (markGood, e) => {
						const now = Date.now();
						if (now - saLastActionTime < 400) {
							if (e.cancelable) e.preventDefault();
							e.stopPropagation();
							return;
						}
						saLastActionTime = now;
						e.stopPropagation();
						window.removeEventListener("keydown", onSaKeyDown);
						gradeCard(markGood);
					};

					if (saBtnAgain) {
						saBtnAgain.onclick = (e) => handleSaGrade(false, e);
						saBtnAgain.addEventListener("touchend", (e) =>
							handleSaGrade(false, e),
						);
						saBtnAgain.addEventListener("click", (e) =>
							handleSaGrade(false, e),
						);
					}
					if (saBtnGood) {
						saBtnGood.onclick = (e) => handleSaGrade(true, e);
						saBtnGood.addEventListener("touchend", (e) =>
							handleSaGrade(true, e),
						);
						saBtnGood.addEventListener("click", (e) =>
							handleSaGrade(true, e),
						);
					}
				}
			} else {
				// --- MULTIPLE CHOICE FEEDBACK ---
				let selectedOpt = null;
				let selectedCorrect = null;
				try {
					selectedOpt = sessionStorage.getItem(
						"notebooklm_sel_opt_" + cardId,
					);
					selectedCorrect = sessionStorage.getItem(
						"notebooklm_sel_corr_" + cardId,
					);
					sessionStorage.removeItem("notebooklm_sel_opt_" + cardId);
					sessionStorage.removeItem("notebooklm_sel_corr_" + cardId);
				} catch (e) {}

				let pillHtml = "";
				if (selectedCorrect !== null) {
					const isCorrect = selectedCorrect === "true";
					const pillClass = isCorrect ? "pill-correct" : "pill-wrong";
					const pillText = isCorrect
						? "✓ Correct (Good)"
						: "✕ Incorrect (Again)";
					pillHtml = `
						<div class="score-pill-container">
							<div class="score-pill ${pillClass}">
								${pillText}
							</div>
						</div>
					`;
				}

				interactiveArea.innerHTML = `
					${pillHtml}
					<div class="options-list" id="back-options"></div>
				`;
				const container = document.getElementById("back-options");

				let orderedItems = validItems;
				try {
					const storedOrder = sessionStorage.getItem(
						"notebooklm_shuffle_" + cardId,
					);
					if (storedOrder) {
						const shuffleKeys = JSON.parse(storedOrder);
						const temp = [];
						shuffleKeys.forEach((k) => {
							const found = validItems.find(
								(i) => i.dataset.opt === k,
							);
							if (found) temp.push(found);
						});
						if (temp.length === validItems.length)
							orderedItems = temp;
					}
					sessionStorage.removeItem("notebooklm_shuffle_" + cardId);
				} catch (e) {}

				orderedItems.forEach((item, index) => {
					const originalLetter = item.dataset.opt;
					const displayLetter = String.fromCharCode(65 + index);
					const text = cleanMath(item.dataset.text || "");
					const reason = cleanMath(item.dataset.reason || "");
					const flagStr = (item.dataset.flag || "")
						.trim()
						.toLowerCase();
					const isCorrect =
						flagStr === "true" ||
						flagStr === "yes" ||
						flagStr === "1";
					const isSelected = selectedOpt === originalLetter;

					const block = document.createElement("div");
					block.className = "option-block";

					const evalResult = evaluateSingleChoiceOption({
						isCorrect,
						isSelected,
						userWasCorrect: selectedCorrect === "true",
					});

					block.classList.add(evalResult.stateClass);

					let feedbackHtml = "";
					if (reason.trim() || evalResult.label) {
						const headerHtml = renderFeedbackHeader(
							evalResult.headerClass,
							evalResult.icon,
							evalResult.label,
						);
						const rationaleContent = reason.trim()
							? `<div class="rationale-text">${reason}</div>`
							: "";

						feedbackHtml = `
							<div class="feedback-section is-revealed">
								${headerHtml}
								${rationaleContent}
							</div>
						`;
					}

					block.innerHTML = `
						<div class="option-content">
							<span class="option-letter">${displayLetter}.</span>
							<span>${text}</span>
						</div>
						${feedbackHtml}
					`;

					container.appendChild(block);
				});

				if (selectedCorrect !== null) {
					renderContinueButton(selectedCorrect === "true");
				}
			}

			setTimeout(() => triggerMath(document.body), 100);
		} catch (e) {
			console.log("Back Template Error:", e);
		}
	})();
</script>
<!-- -------------------- NotebookLM Template: End -------------------- -->
